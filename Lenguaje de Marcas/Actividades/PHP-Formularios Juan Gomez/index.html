<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario de Registro</title>
</head>

<body>

<h2>Formulario de Usuario</h2>

<form action="./php/procesar.php" method="post">

Nombre:
<input type="text" name="nombre"><br><br>

Email:
<input type="email" name="email"><br><br>

Edad:
<input type="number" name="edad"><br><br>

Fecha de nacimiento:
<input type="date" name="fecha"><br><br>

Hora de registro:
<input type="time" name="hora"><br><br>

Ciudad:
<select name="ciudad">
<option value="Madrid">Madrid</option>
<option value="Barcelona">Barcelona</option>
<option value="Valencia">Valencia</option>
</select>
<br><br>

Intereses:<br>
<input type="checkbox" name="intereses[]" value="Programación"> Programación<br>
<input type="checkbox" name="intereses[]" value="Videojuegos"> Videojuegos<br>
<input type="checkbox" name="intereses[]" value="Deporte"> Deporte<br>
<br>

<input type="submit" value="Enviar">

</form>

</body>
</html>
